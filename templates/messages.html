<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sʌʜɩɭ MESSENGER👿🥀</title>
    <!-- Link to Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:wght@400;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://i.ibb.co/f4Jk28h/images.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center vertically */
            overflow: hidden;
        }
        .header {
            text-align: center;
            font-family: 'Lobster', cursive;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            font-size: 3em; /* Adjust font size for header */
            position: absolute; /* Position header absolutely */
            top: 10px; /* Move header 10px from the top */
            z-index: 1000;
            white-space: nowrap; /* Prevent text from wrapping */
            overflow: hidden; /* Hide overflow */
            text-overflow: ellipsis; /* Add ellipsis if text overflows */
            animation: fadeInOut 3s infinite; /* Animation for header */
        }
        .batch-id {
            font-size: 0.8em; /* Smaller font size for batch ID */
            color: white;
            position: absolute; /* Position batch-id absolutely */
            top: calc(10px + 3em + 10px); /* 10px below the header (3em for header height + 10px margin) */
            text-align: center; /* Center text alignment */
            height: 50px; /* Adjust height of batch-id element */
            line-height: 50px; /* Align text vertically */
            overflow: hidden; /* Hide overflow if text is too long */
        }
        #message-container {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            height: 300px;
            overflow-y: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 120px; /* Adjust margin to move container further down */
            position: relative;
            color: white;
        }
        #message-container p {
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
            padding-bottom: 15px;
        }
        #message-container strong {
            color: yellow;
        }
        #stop-button {
            display: block;
            margin: 30px auto;
            padding: 15px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
            z-index: 1000;
            animation: fadeInOut 3s infinite; /* Animation for stop button */
        }
        #stop-button:hover {
            background-color: darkred;
        }
        @keyframes fadeInOut {
            0%, 100% {
                opacity: 1;
                transform: translateY(0);
            }
            50% {
                opacity: 0.5;
                transform: translateY(-10px);
            }
        }
        #stop-message {
            color: yellow;
            font-size: 1.5em;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">Sahil Choudhary</div>
    
    <div class="batch-id">Batch ID: {{ batch_id }}</div>
    <div id="message-container"></div>
    <button id="stop-button">Stop Sending</button>
    <div id="stop-message"></div>

    <script>
        const batchId = "{{ batch_id }}";
        const messageContainer = document.getElementById('message-container');
        const stopButton = document.getElementById('stop-button');
        const stopMessage = document.getElementById('stop-message');

        function fetchMessages() {
            fetch(`/logs/${batchId}`)
                .then(response => response.json())
                .then(data => {
                    messageContainer.innerHTML = '';
                    data.forEach(log => {
                        messageContainer.innerHTML += `<p><strong>Account Name:</strong> ${log.accountName}<br>
                            <strong>Time:</strong> ${log.time}<br>
                            <strong>Conversation ID:</strong> ${log.convoId}<br>
                            <strong>Status:</strong> ${log.status}<br>
                            <strong>Message:</strong> ${log.message}</p>`;
                    });
                    messageContainer.scrollTop = messageContainer.scrollHeight; // Auto-scroll to bottom
                });
        }

        fetchMessages();
        setInterval(fetchMessages, 5000);
        stopButton.addEventListener('click', () => {
            fetch(`/stop/${batchId}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "stopped") {
                        stopMessage.textContent = 'Message sending stopped.'; // Show message on screen
                    }
                });
        });
    </script>
</body>
</html>
